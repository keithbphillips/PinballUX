name: Build Debian Package

on:
  release:
    types: [created]
  workflow_dispatch:

# The default GITHUB_TOKEN in this repo is read-only; attaching files to a
# release needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts rsync

    - name: Build package
      run: |
        dpkg-buildpackage -us -uc -b
        mv ../pinballux_*.deb .
        ls -l pinballux_*.deb

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pinballux-deb
        path: pinballux_*.deb
        retention-days: 30

    - name: Upload to release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: pinballux_*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
